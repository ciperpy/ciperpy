<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel · Ubaid Bilal Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 2rem;
        }

        .admin-container {
            max-width: 600px;
            margin: 0 auto;
        }

        .admin-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 2rem;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        .admin-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .admin-header h1 {
            font-size: 1.8rem;
            color: #1f2937;
            margin-bottom: 0.5rem;
        }

        .admin-header p {
            color: #6b7280;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #374151;
        }

        input, textarea, select {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #e5e7eb;
            border-radius: 1rem;
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.2s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            background: linear-gradient(135deg, #3b82f6, #a855f7);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            font-size: 1rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
        }

        .btn-secondary {
            background: #6b7280;
            margin-top: 1rem;
        }

        .btn-secondary:hover {
            background: #4b5563;
        }

        .preview-card {
            background: #f9fafb;
            border-radius: 1rem;
            padding: 1rem;
            margin: 1.5rem 0;
            border: 1px solid #e5e7eb;
        }

        .preview-card h4 {
            margin-bottom: 0.5rem;
            color: #374151;
        }

        .notification-preview {
            background: white;
            border-radius: 0.5rem;
            padding: 1rem;
            border-left: 4px solid #3b82f6;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .notification-preview .title {
            font-weight: bold;
            margin-bottom: 0.3rem;
        }

        .notification-preview .message {
            font-size: 0.85rem;
            color: #6b7280;
        }

        .status {
            margin-top: 1rem;
            padding: 0.8rem;
            border-radius: 0.5rem;
            text-align: center;
            display: none;
        }

        .status.success {
            background: #d1fae5;
            color: #065f46;
            display: block;
        }

        .status.error {
            background: #fee2e2;
            color: #991b1b;
            display: block;
        }

        .notification-history {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e5e7eb;
        }

        .notification-history h3 {
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }

        .history-item {
            background: #f9fafb;
            padding: 0.8rem;
            border-radius: 0.5rem;
            margin-bottom: 0.5rem;
            border-left: 3px solid #3b82f6;
        }

        .history-item .history-title {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .history-item .history-message {
            font-size: 0.8rem;
            color: #6b7280;
            margin-top: 0.2rem;
        }

        .history-item .history-time {
            font-size: 0.7rem;
            color: #9ca3af;
            margin-top: 0.3rem;
        }

        .clear-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            cursor: pointer;
            font-size: 0.8rem;
            margin-top: 1rem;
            width: auto;
            display: inline-block;
        }

        .clear-btn:hover {
            background: #dc2626;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }
            .admin-card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-card">
            <div class="admin-header">
                <i class="fas fa-bell" style="font-size: 2rem; color: #3b82f6; margin-bottom: 0.5rem; display: inline-block;"></i>
                <h1>📢 Admin Notification Panel</h1>
                <p>Send real-time notifications to your website visitors</p>
            </div>

            <div class="form-group">
                <label><i class="fas fa-tag"></i> Notification Type</label>
                <select id="notifType">
                    <option value="info">ℹ️ Info / Update</option>
                    <option value="success">✅ Success / Achievement</option>
                    <option value="warning">⚠️ Warning / Alert</option>
                    <option value="new">🆕 New Project / Feature</option>
                </select>
            </div>

            <div class="form-group">
                <label><i class="fas fa-heading"></i> Title</label>
                <input type="text" id="notifTitle" placeholder="e.g., New Project Launched!" value="New Update!">
            </div>

            <div class="form-group">
                <label><i class="fas fa-message"></i> Message</label>
                <textarea id="notifMessage" placeholder="Enter your notification message here...">Check out my latest project on the portfolio!</textarea>
            </div>

            <div class="form-group">
                <label><i class="fas fa-link"></i> Link (Optional)</label>
                <input type="text" id="notifLink" placeholder="https://...">
            </div>

            <div class="preview-card">
                <h4><i class="fas fa-eye"></i> Preview</h4>
                <div class="notification-preview" id="preview">
                    <div class="title" id="previewTitle">New Update!</div>
                    <div class="message" id="previewMessage">Check out my latest project on the portfolio!</div>
                </div>
            </div>

            <button class="btn" id="sendNotificationBtn">
                <i class="fas fa-paper-plane"></i> Send Notification Now
            </button>

            <div id="status" class="status"></div>

            <div class="notification-history">
                <h3><i class="fas fa-history"></i> Recent Notifications Sent</h3>
                <div id="historyList"></div>
                <button class="clear-btn" id="clearHistoryBtn">
                    <i class="fas fa-trash"></i> Clear History
                </button>
            </div>
        </div>
    </div>

    <script>
        // Load saved notifications history
        let notificationHistory = JSON.parse(localStorage.getItem('notificationHistory') || '[]');

        // Update preview in real-time
        const titleInput = document.getElementById('notifTitle');
        const messageInput = document.getElementById('notifMessage');
        const previewTitle = document.getElementById('previewTitle');
        const previewMessage = document.getElementById('previewMessage');
        const notifType = document.getElementById('notifType');

        function updatePreview() {
            previewTitle.innerText = titleInput.value || 'No Title';
            previewMessage.innerText = messageInput.value || 'No Message';

            // Change preview border color based on type
            const previewDiv = document.getElementById('preview');
            const type = notifType.value;
            let borderColor = '#3b82f6';
            if (type === 'success') borderColor = '#10b981';
            if (type === 'warning') borderColor = '#f59e0b';
            if (type === 'new') borderColor = '#8b5cf6';
            previewDiv.style.borderLeftColor = borderColor;
        }

        titleInput.addEventListener('input', updatePreview);
        messageInput.addEventListener('input', updatePreview);
        notifType.addEventListener('change', updatePreview);
        updatePreview();

        // Send notification
        function sendNotification() {
            const title = titleInput.value.trim();
            const message = messageInput.value.trim();
            const type = notifType.value;
            const link = document.getElementById('notifLink').value.trim();

            if (!title || !message) {
                showStatus('Please enter both title and message', 'error');
                return;
            }

            // Create notification object
            const notification = {
                id: Date.now(),
                title: title,
                message: message,
                type: type,
                link: link,
                timestamp: new Date().toLocaleString()
            };

            // Save to history
            notificationHistory.unshift(notification);
            if (notificationHistory.length > 20) notificationHistory.pop();
            localStorage.setItem('notificationHistory', JSON.stringify(notificationHistory));

            // Store current notification to be shown on website
            localStorage.setItem('pendingNotification', JSON.stringify(notification));

            // Show success
            showStatus('✅ Notification sent successfully! Visitors will see it when they visit the site.', 'success');

            // Clear link after sending (optional)
            document.getElementById('notifLink').value = '';

            // Refresh history display
            displayHistory();

            // Play success sound
            playNotificationSound();
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = message;
            statusDiv.className = `status ${type}`;
            setTimeout(() => {
                statusDiv.className = 'status';
            }, 3000);
        }

        function playNotificationSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.frequency.value = 880;
                gainNode.gain.value = 0.1;
                oscillator.start();
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.3);
                oscillator.stop(audioCtx.currentTime + 0.3);
            } catch(e) {}
        }

        function displayHistory() {
            const historyList = document.getElementById('historyList');
            if (notificationHistory.length === 0) {
                historyList.innerHTML = '<div style="text-align: center; color: #9ca3af; padding: 1rem;">No notifications sent yet</div>';
                return;
            }

            historyList.innerHTML = notificationHistory.map(notif => `
                <div class="history-item">
                    <div class="history-title">
                        <i class="fas ${getIconForType(notif.type)}"></i> ${escapeHtml(notif.title)}
                    </div>
                    <div class="history-message">${escapeHtml(notif.message)}</div>
                    <div class="history-time">📅 ${notif.timestamp}</div>
                </div>
            `).join('');
        }

        function getIconForType(type) {
            switch(type) {
                case 'success': return 'fa-check-circle';
                case 'warning': return 'fa-exclamation-triangle';
                case 'new': return 'fa-star';
                default: return 'fa-bell';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('sendNotificationBtn').addEventListener('click', sendNotification);

        document.getElementById('clearHistoryBtn').addEventListener('click', () => {
            if (confirm('Are you sure you want to clear all notification history?')) {
                notificationHistory = [];
                localStorage.setItem('notificationHistory', JSON.stringify(notificationHistory));
                displayHistory();
                showStatus('History cleared!', 'success');
            }
        });

        displayHistory();

        // Keyboard shortcut: Ctrl+Enter to send
        messageInput.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                sendNotification();
            }
        });
    </script>
</body>
</html>
